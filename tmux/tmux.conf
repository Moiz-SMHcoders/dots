
# ---------- PATH & Basics ----------
set-environment -g PATH "/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/usr/bin:/bin"

set -g prefix C-b
# On the dev VM, switch the prefix to C-a so a nested tmux (local C-b -> remote)
# doesn't collide. Only fires when hostname is "dev"; the Mac keeps C-b.
if-shell '[ "$(hostname -s)" = dev ]' "set -g prefix C-a; unbind C-b; bind C-a send-prefix"
set -a terminal-features "tmux-256color:RGB"
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=blue bold"

# ---------- Status Line ----------
set -g status-interval 5
set -g status-right '#{?client_prefix, _ ,}#(timew | awk "/^ *Total/ {print \$NF}") #[bg=green,fg=black,bold]#(timew | awk "/^ *Tracking/ {print \" \" \$NF \" \"}")#[bg=default]'
set -g status-left "#S"

# ---------- Quick Binds ----------
bind-key -n M-BSpace send-keys C-w
bind r source-file "~/.config/tmux/tmux.conf"
bind G run "~/.config/scripts/open-github.sh"

# quick launchers
bind g neww -n "git" -S lazygit
bind e neww -S "nvim"

# Open the native session list
bind s choose-session -O time -r -Z

# Inside choose-tree, press Ctrl-n to create a new session (prompted for name).
bind-key -T root C-n \
  if -F '#{==:#{pane_mode},tree-mode}' \
     'command-prompt -p "New session name:" "new-session -As %1"' \
     'send-keys C-n'

# ---------- Plugins (TPM + sensible + resurrect + continuum + sessionx) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'omerxx/tmux-sessionx'

# Persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# SessionX config – sessionizer style
# Key to launch (with prefix): C-b o
set -g @sessionx-bind 'o'
# Common project roots to always show (adjust to taste)
set -g @sessionx-custom-paths "$HOME/projects,$HOME/Code,$HOME/.config"
# Also show subdirectories under those roots
set -g @sessionx-custom-paths-subdirectories 'true'
# Use fzf --tmux builtin (recommended on modern fzf)
set -g @sessionx-fzf-builtin-tmux 'on'
# Turn on zoxide integration if you're using it
set -g @sessionx-zoxide-mode 'on'
# (Optional) show current session in list immediately
set -g @sessionx-filter-current 'false'


# Auto-restore last snapshot when tmux starts
set -g @continuum-restore 'on'
# Save more frequently (minutes). Default is 15.
set -g @continuum-save-interval '5'

# Resurrect tweaks
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim vim emacs htop btop btm lazygit ssh top man node python ipython zsh bash fish codex'

# Initialize TPM (keep at bottom)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'
